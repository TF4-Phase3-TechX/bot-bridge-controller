name: Isolated bridge - B decides
run-name: ${{ inputs.source_repo && format('Reconcile {0} {1} PR {2}', inputs.source_repo, inputs.source_event || 'push', inputs.source_pr || '-') || 'Isolated bridge - B decides' }}
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository that requested reconciliation
        required: false
        type: string
      source_sha:
        description: Event SHA for traceability; controller reads actual PRs and B main
        required: false
        type: string
      source_run_id:
        description: B notification workflow run ID
        required: false
        type: string
      source_event:
        description: Notification event type
        required: false
        type: string
      source_pr:
        description: PR number for PR and comment events
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: bridge-policy-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --check scripts/pr-bridge.mjs && node --test tests/*.test.mjs
  plan:
    if: vars.BRIDGE_ENABLED == 'true' && github.repository == 'TF4-Phase3-TechX/bot-bridge-controller' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select registered pairs without App secrets
        id: pairs
        env:
          TRIGGER_SOURCE_REPO: ${{ inputs.source_repo }}
          TRIGGER_SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TRIGGER_SOURCE_EVENT: ${{ inputs.source_event }}
          TRIGGER_SOURCE_PR: ${{ inputs.source_pr }}
        run: node scripts/bridge-config.mjs
  reconcile:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: isolated-bridge-${{ matrix.id }}
      cancel-in-progress: false
    name: Reconcile ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check this trusted controller revision before creating App tokens
        run: node --check scripts/pr-bridge.mjs && node --test tests/*.test.mjs
      - name: Token scoped only to repo A
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: source
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.sourceOwner }}
          repositories: ${{ matrix.sourceRepo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Token scoped only to repo B including workflow transport
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: target
        with:
          client-id: ${{ vars.BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.targetOwner }}
          repositories: ${{ matrix.targetRepo }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Transfer PRs and synchronize A to authoritative B main
        env:
          BRIDGE_PAIR_ID: ${{ matrix.id }}
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
          BRIDGE_APP_TOKEN: ${{ steps.target.outputs.token }}
          TRIGGER_SOURCE_REPO: ${{ inputs.source_repo }}
          TRIGGER_SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TRIGGER_SOURCE_EVENT: ${{ inputs.source_event }}
          TRIGGER_SOURCE_PR: ${{ inputs.source_pr }}
        run: node scripts/pr-bridge.mjs
