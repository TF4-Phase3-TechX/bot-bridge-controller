name: Notify contribution bridge
on:
  push:
    branches: ['**']
  pull_request_target:
    branches: [TARGET_BRANCH]
    types: [opened, synchronize, reopened, closed, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  pull-requests: read

concurrency:
  group: notify-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.repository == 'A_OWNER/A_REPO' || github.repository == 'B_OWNER/B_REPO') &&
      (
        (github.event_name == 'push' && github.repository == 'B_OWNER/B_REPO' && startsWith(github.ref, 'refs/heads/') &&
          github.event.sender.login != 'TRANSPORT_BOT[bot]') ||
        (github.event.sender.type == 'User' &&
          (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
            ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment') &&
              github.event.pull_request.base.ref == 'TARGET_BRANCH' && github.event.pull_request.head.repo.full_name == github.repository &&
              (github.repository == 'A_OWNER/A_REPO' ||
                (startsWith(github.event.pull_request.head.ref, 'incoming/a-pr-') &&
                 github.event.pull_request.user.login == 'TRANSPORT_BOT[bot]')))
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Allow only TARGET_BRANCH PR events or TechX branch pushes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { GH_TOKEN, SOURCE_REPO: repo, SOURCE_EVENT: event, SOURCE_PR: number } = process.env;
          let allowed = false;
          if (event === 'push') {
            allowed = repo === 'B_OWNER/B_REPO';
          } else {
            if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR number');
            const response = await fetch(`https://api.github.com/repos/${repo}/pulls/${number}`, {
              headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Cannot check current PR target: HTTP ${response.status}`);
            const pr = await response.json();
            allowed = pr.base.ref === 'TARGET_BRANCH' && pr.head.repo?.full_name === repo
              && (repo !== 'B_OWNER/B_REPO'
                || (/^incoming\/a-pr-[1-9][0-9]*$/.test(pr.head.ref) && pr.user?.login === 'TRANSPORT_BOT[bot]'));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          if (!allowed) console.log('No dispatch: PR must target TARGET_BRANCH, have a head in this repository and, in TechX, be a bridge PR (incoming/a-pr-N).');
          NODE
      # No checkout, PR code, dependencies, or interpolated comment text in this job.
      - name: Token scoped only to controller Actions
        if: steps.scope.outputs.allowed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: dispatch
        with:
          client-id: ${{ vars.CONTROLLER_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTROLLER_DISPATCH_APP_PRIVATE_KEY }}
          owner: B_OWNER
          repositories: CONTROLLER_REPO
          permission-actions: write
      - name: Dispatch trusted controller main
        if: steps.scope.outputs.allowed == 'true'
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { SOURCE_REPO: repo, SOURCE_SHA: sha, SOURCE_RUN_ID: runId, SOURCE_EVENT: event, SOURCE_PR: pr } = process.env;
          if (!['A_OWNER/A_REPO', 'B_OWNER/B_REPO'].includes(repo)
            || !/^[a-f0-9]{40}$/.test(sha) || !/^[1-9][0-9]*$/.test(runId)
            || !['push','pull_request_target','issue_comment','pull_request_review','pull_request_review_comment'].includes(event)
            || (event === 'push' ? repo !== 'B_OWNER/B_REPO' || Boolean(pr) : !/^[1-9][0-9]*$/.test(pr))) throw new Error('Invalid source event');
          const response = await fetch('https://api.github.com/repos/B_OWNER/CONTROLLER_REPO/actions/workflows/controller.yml/dispatches', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.DISPATCH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ ref: 'main', inputs: {
              source_repo: repo, source_sha: sha, source_run_id: runId, source_event: event, source_pr: pr,
            } }),
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Controller dispatch failed: HTTP ${response.status}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# Contribution event dispatched\n\nSource: ${repo} / ${event}${pr ? ` / PR #${pr}` : ''}\n\nEvent SHA: \`${sha}\`\n\nController: B_OWNER/CONTROLLER_REPO / controller.yml / main\n\nSource run: https://github.com/${repo}/actions/runs/${runId}\n\nDispatch accepted: HTTP ${response.status}. Inspect the controller run for the reconciliation result.\n`);
          NODE
